<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 助理 App</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 100px; margin-bottom: 1rem; }
    input { width: 100%; margin-bottom: 1rem; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #output { margin-top: 1.5rem; padding: 1rem; background: #f4f4f4; border-radius: 4px; whitespace: pre-wrap; }
  </style>
</head>
<body>
  <h2>Gemini AI Web App</h2>
  
  <label for="apiKey">輸入你的 Gemini API Key：</label>
  <input type="password" id="apiKey" placeholder="AIzaSy..." />

  <label for="prompt">提問內容：</label>
  <textarea id="prompt" placeholder="請寫一段短文..."></textarea>

  <button onclick="generateContent()">送出請求</button>

  <div id="output">結果將顯示於此...</div>

  <script>
    async function generateContent() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const outputDiv = document.getElementById('output');

      if (!apiKey || !prompt) {
        alert('請填寫 API Key 與提問內容！');
        return;
      }

      outputDiv.innerText = '思考中...';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          outputDiv.innerText = data.candidates[0].content.parts[0].text;
        } else {
          outputDiv.innerText = '發生錯誤：' + JSON.stringify(data, null, 2);
        }
      } catch (err) {
        outputDiv.innerText = '連線失敗：' + err.message;
      }
    }
  </script>
</body>
</html>
