<!DOCTYPE html>

  <title>國外旅遊險與不便險試算比較</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->

    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-plane-departure text-2xl text-yellow-300"></i>
        <h1 class="text-xl font-bold tracking-wide">海外旅遊險試算與比較工具</h1>

      <p class="font-bold flex items-center gap-1">
        <i class="fa-solid fa-triangle-exclamation"></i> 投保小常識：人壽保險 vs. 產物保險
      </p>
      <p class="mt-1">
        • <strong>人壽公司</strong>（如南山人壽）：多僅提供「旅平險」（身故＋身心障礙＋醫療），<strong>不含不便險</strong>，費用較便宜。<br>
        • <strong>產險公司</strong>（如南山產物、臺產）：提供「旅平險＋旅遊不便險」（班機/行李延誤、行程變更），保障最全面。
      </p>
    </div>

    <!-- 試算條件設定卡片 -->

      <h2 class="text-lg font-bold text-slate-800 border-b pb-3 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-sliders text-blue-600"></i> 行程與保費試算條件
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium
